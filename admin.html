<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel — VAA</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1117">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f6f8;color:#111820;overflow-x:hidden}
a{text-decoration:none;color:inherit}
:root{--yellow:#ffd400;--dark:#0b1117;--muted:#687382;--line:#e2e6eb;--red:#e33;--green:#0a7a4f}
.container{width:min(1180px,96%);margin:auto}
.nav{position:sticky;top:0;z-index:100;background:rgba(11,17,23,.97);color:white;border-bottom:1px solid #252d36}
.navin{height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:950;letter-spacing:-1.5px}
.brand i{color:var(--yellow);font-style:normal}
.navlinks{display:flex;align-items:center;gap:16px;font-size:12px;font-weight:800}
.navlinks a:hover{color:var(--yellow)}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:900;cursor:pointer;display:inline-block;transition:.2s;font-family:inherit}
.btn:hover{transform:translateY(-1px)}
.primary{background:var(--yellow);color:#101010}
.darkbtn{background:#17202a;color:white;border:1px solid #3b4652}
.danger{background:var(--red);color:white}
.btn-sm{padding:7px 11px;font-size:12px}
/* LOGIN GATE */
.gate{position:fixed;inset:0;background:var(--dark);color:white;display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
.gate-box{background:#17212b;border:1px solid #2a3540;border-radius:20px;padding:36px 28px;max-width:420px;width:100%;text-align:center}
.gate-box h1{margin:0 0 8px;font-size:28px;letter-spacing:-1px}
.gate-box h1 i{color:var(--yellow);font-style:normal}
.gate-box p{color:#9da7b2;font-size:13px;line-height:1.5;margin:0 0 22px}
.gate-box input{width:100%;padding:14px;border:1px solid #2a3540;border-radius:11px;background:#0f171f;color:white;font:inherit;text-align:center;font-size:16px;letter-spacing:2px}
.gate-box input:focus{outline:none;border-color:var(--yellow)}
.gate-box button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:11px;background:var(--yellow);color:#101010;font-weight:900;font-size:15px;cursor:pointer}
.gate-err{color:#ff7b7b;font-size:13px;margin-top:12px;display:none}
/* MAIN */
#panel{display:none}
header.admin{padding:30px 0 20px}
header.admin h1{margin:0 0 6px;font-size:32px;letter-spacing:-1.5px}
header.admin h1 span{color:var(--yellow)}
header.admin p{color:var(--muted);margin:0;font-size:14px}
.statbar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{display:block;font-size:28px;letter-spacing:-1px}
.stat span{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:800;text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px}
.tab{border:1px solid var(--line);background:white;padding:10px 16px;border-radius:99px;font-weight:850;cursor:pointer;font-size:13px;font-family:inherit;color:#111820}
.tab.active{background:var(--dark);color:var(--yellow);border-color:var(--dark)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:white}
.toolbar .search:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,212,0,.22)}
.table-wrap{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f7f8fa;text-align:left;padding:12px 14px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-weight:900}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fafbfc}
.name{font-weight:850}
.small{color:var(--muted);font-size:12px;line-height:1.5}
.tag{display:inline-block;background:#eef1f4;padding:3px 8px;border-radius:99px;font-size:10px;font-weight:850;margin:2px 2px 0 0}
.tag.open{background:#d8f5e4;color:var(--green)}
.tag.closed{background:#f0d8d8;color:#a02222}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:#111820;font-size:16px;margin-bottom:6px}
.loading{padding:50px 20px;text-align:center;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--yellow);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:18px;bottom:18px;background:#111820;color:white;padding:13px 17px;border-radius:10px;display:none;z-index:300;font-size:13px;font-weight:700}
footer{background:#0b1117;color:#b8c1ca;padding:28px 0;margin-top:40px;font-size:12px;text-align:center}
footer b{color:var(--yellow)}
@media(max-width:700px){
  th:nth-child(3),td:nth-child(3){display:none}
  .statbar{grid-template-columns:1fr}
  header.admin h1{font-size:26px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1><i>V</i>AA Admin</h1>
    <p>Enter admin password to access the control panel.</p>
    <input id="pw" type="password" placeholder="Password" autofocus>
    <button onclick="checkPw()">Unlock Panel</button>
    <div class="gate-err" id="gateErr">Wrong password. Try again.</div>
  </div>
</div>

<div id="panel">
  <header class="nav"><div class="container navin">
    <a class="brand" href="index.html"><i>V</i>AA <span style="color:#687382;font-size:12px;letter-spacing:2px">ADMIN</span></a>
    <nav class="navlinks">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="#" onclick="logout();return false">Logout</a>
    </nav>
  </div></header>

  <div class="container">
    <header class="admin">
      <h1>Admin <span>Panel</span></h1>
      <p>Full control over users, jobs and listings on VAA.</p>
    </header>

    <div class="statbar">
      <div class="stat"><b id="statUsers">0</b><span>Registered Users</span></div>
      <div class="stat"><b id="statJobs">0</b><span>Job Requirements</span></div>
      <div class="stat"><b id="statListings">0</b><span>Material Listings</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="users">👥 Users</button>
      <button class="tab" data-tab="jobs">📋 Jobs</button>
      <button class="tab" data-tab="listings">🧱 Listings</button>
    </div>

    <div class="toolbar">
      <input class="search" id="searchInput" placeholder="Search anything...">
      <button class="btn darkbtn btn-sm" onclick="loadAll()">↻ Refresh</button>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="loading"><div class="spinner"></div>Loading data...</div>
    </div>
  </div>

  <footer>VAA Admin · <b>Logged in as Admin</b></footer>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== CONFIG ===== */
const ADMIN_PASSWORD = "vaa2025";
const SUPABASE_URL = "https://gynphsibkcrivosuamxp.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5bnBoc2lia2NyaXZvc3VhbXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTA0NzQsImV4cCI6MjEwNTQ2NjQ3NH0.GNKrZgJFj4496-kPzfdc2Fzv3bS8YO6CLrWPV4PyucM";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===== STATE ===== */
let currentTab = "users";
let dataUsers = [], dataJobs = [], dataListings = [];

/* ===== HELPERS ===== */
function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2400)}
function fmtDate(d){
  if(!d) return "";
  try { const dt = new Date(d); return dt.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}); }
  catch(e){ return ""; }
}

/* ===== LOGIN GATE ===== */
function checkPw(){
  const val = document.getElementById("pw").value.trim();
  if (val === ADMIN_PASSWORD) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("panel").style.display = "block";
    sessionStorage.setItem("vaaAdmin", "ok");
    loadAll();
    setInterval(loadAll, 60000);
  } else {
    document.getElementById("gateErr").style.display = "block";
    document.getElementById("pw").value = "";
  }
}
document.addEventListener("DOMContentLoaded", () => {
  const pw = document.getElementById("pw");
  if (pw) pw.addEventListener("keydown", e => { if (e.key === "Enter") checkPw(); });
  if (sessionStorage.getItem("vaaAdmin") === "ok") {
    document.getElementById("gate").style.display = "none";
    document.getElementById("panel").style.display = "block";
    loadAll();
    setInterval(loadAll, 60000);
  }
});
function logout(){
  sessionStorage.removeItem("vaaAdmin");
  location.reload();
}

/* ===== LOAD DATA ===== */
async function loadAll(){
  try {
    const [u, j, l] = await Promise.all([
      sb.from("vaa_users").select("*").order("created", { ascending: false }),
      sb.from("vaa_jobs").select("*").order("created", { ascending: false }),
      sb.from("vaa_listings").select("*").order("created", { ascending: false })
    ]);
    dataUsers = u.data || [];
    dataJobs = j.data || [];
    dataListings = l.data || [];
    document.getElementById("statUsers").textContent = dataUsers.length;
    document.getElementById("statJobs").textContent = dataJobs.length;
    document.getElementById("statListings").textContent = dataListings.length;
    render();
  } catch (err) {
    console.error("load error:", err);
    document.getElementById("tableWrap").innerHTML = '<div class="empty"><b>Could not load data</b>Check your connection and try again.</div>';
  }
}

/* ===== RENDER ===== */
function render(){
  const wrap = document.getElementById("tableWrap");
  const q = (document.getElementById("searchInput").value || "").toLowerCase().trim();

  const filterFn = (item) => {
    if (!q) return true;
    return Object.values(item).join(" ").toLowerCase().includes(q);
  };

  let items, headers, rowFn;

  if (currentTab === "users") {
    items = dataUsers.filter(filterFn);
    headers = ["Name", "Phone", "Role", "Category / Area", "Actions"];
    rowFn = u => `<tr>
      <td><div class="name">${esc(u.name)}</div><div class="small">ID ${esc(u.id)} · ${fmtDate(u.created)}</div></td>
      <td>${esc(u.phone)}</td>
      <td><span class="tag">${esc(u.role||"")}</span></td>
      <td><div class="small">${esc(u.category||"")}${u.area ? " · " + esc(u.area) : ""}</div></td>
      <td><button class="btn danger btn-sm" onclick="delRow('vaa_users',${u.id})">Delete</button></td>
    </tr>`;
  } else if (currentTab === "jobs") {
    items = dataJobs.filter(filterFn);
    headers = ["Job", "Contact", "Details", "Status", "Actions"];
    rowFn = j => `<tr>
      <td><div class="name">${esc(j.category||"")}</div><div class="small">${esc(j.count||"1")} worker(s)</div></td>
      <td><div class="name">${esc(j.name||"")}</div><div class="small">${esc(j.phone||"")}</div></td>
      <td><div class="small">📍 ${esc(j.location||"")}${j.budget ? " · 💰 " + esc(j.budget) : ""}${j.duration ? " · ⏱ " + esc(j.duration) : ""}</div><div class="small">${esc(j.details||"")}</div></td>
      <td><span class="tag ${j.status === 'Closed' ? 'closed' : 'open'}">${esc(j.status||"Open")}</span></td>
      <td>
        <button class="btn darkbtn btn-sm" onclick="toggleStatus(${j.id},'${esc(j.status||"Open")}')">${j.status === 'Closed' ? 'Reopen' : 'Close'}</button>
        <button class="btn danger btn-sm" onclick="delRow('vaa_jobs',${j.id})" style="margin-top:4px">Delete</button>
      </td>
    </tr>`;
  } else {
    items = dataListings.filter(filterFn);
    headers = ["Product", "Contact", "Details", "Actions"];
    rowFn = l => `<tr>
      <td><div class="name">${esc(l.product||"")}</div><div class="small">${esc(l.category||"")}</div></td>
      <td><div class="name">${esc(l.name||"")}</div><div class="small">${esc(l.phone||"")}</div></td>
      <td><div class="small">📍 ${esc(l.area||"")}${l.price ? " · 💰 " + esc(l.price) : ""}</div><div class="small">${esc(l.details||"")}</div></td>
      <td><button class="btn danger btn-sm" onclick="delRow('vaa_listings',${l.id})">Delete</button></td>
    </tr>`;
  }

  if (items.length === 0) {
    wrap.innerHTML = '<div class="empty"><b>No entries found</b>' + (q ? "Try a different search." : "Nothing here yet.") + '</div>';
    return;
  }

  wrap.innerHTML = `<table>
    <thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${items.map(rowFn).join("")}</tbody>
  </table>`;
}

/* ===== ACTIONS ===== */
async function delRow(table, id){
  if (!confirm("Delete this entry permanently?\n\nThis cannot be undone.")) return;
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) { toast("Error: " + error.message); return; }
  toast("Deleted ✓");
  loadAll();
}

async function toggleStatus(id, current){
  const next = current === "Closed" ? "Open" : "Closed";
  const { error } = await sb.from("vaa_jobs").update({ status: next }).eq("id", id);
  if (error) { toast("Error: " + error.message); return; }
  toast("Marked as " + next);
  loadAll();
}

/* ===== TABS ===== */
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    currentTab = t.dataset.tab;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", render);
</script>
</body>
</html>
